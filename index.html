<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My OWL Project</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fb;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        color: #1f2937;
        cursor: pointer;
        padding: 8px 12px;
      }

      button:hover {
        border-color: #2563eb;
      }

      a {
        color: #2563eb;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        background: #111827;
        color: #ffffff;
        padding: 20px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 20px;
      }

      .brand span {
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        padding: 4px 8px;
        font-weight: 700;
      }

      .brand strong {
        font-size: 20px;
      }

      nav {
        display: grid;
        gap: 8px;
      }

      nav button {
        display: grid;
        gap: 4px;
        width: 100%;
        min-height: 64px;
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #ffffff;
        text-align: left;
      }

      nav button.active {
        border-color: #38bdf8;
        background: #0f766e;
      }

      nav small {
        color: #cbd5e1;
        line-height: 1.35;
      }

      .content {
        min-width: 0;
        padding: 24px;
      }

      .content-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .content-header h1 {
        margin: 0 0 6px;
        font-size: 28px;
      }

      .content-header p {
        margin: 0;
        color: #64748b;
      }

      .workbench {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) minmax(360px, 0.95fr);
        gap: 16px;
        align-items: start;
      }

      .preview-panel,
      .code-panel {
        min-width: 0;
        border: 1px solid #d9e2ef;
        border-radius: 8px;
        background: #ffffff;
      }

      .preview-panel {
        padding: 20px;
      }

      .code-panel h2 {
        margin: 0;
        border-bottom: 1px solid #d9e2ef;
        padding: 14px 16px;
        font-size: 16px;
      }

      pre {
        margin: 0;
        max-height: calc(100vh - 160px);
        overflow: auto;
        padding: 16px;
        background: #0f172a;
        color: #dbeafe;
        font-size: 13px;
        line-height: 1.55;
      }

      code {
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .example {
        display: grid;
        gap: 16px;
      }

      .example h2 {
        margin: 0;
        font-size: 22px;
      }

      .example p {
        margin: 0;
        color: #475569;
      }

      .toolbar,
      .inline-form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      input,
      select,
      textarea {
        min-height: 36px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 8px 10px;
      }

      textarea {
        min-height: 82px;
        resize: vertical;
      }

      .metric {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid #d9e2ef;
        border-radius: 8px;
        padding: 14px;
        background: #f8fafc;
      }

      .metric strong {
        font-size: 26px;
        color: #0f766e;
      }

      .list,
      .log {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .list li,
      .log li {
        border: 1px solid #d9e2ef;
        border-radius: 6px;
        padding: 10px;
        background: #f8fafc;
      }

      .list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .list li.done span {
        color: #64748b;
        text-decoration: line-through;
      }

      .event-box,
      .notice {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        padding: 14px;
      }

      .event-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .notice.strong {
        border-color: #0f766e;
        background: #ecfdf5;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .form-grid label,
      fieldset {
        display: grid;
        gap: 8px;
      }

      .form-grid .check,
      fieldset label {
        display: flex;
        align-items: center;
      }

      fieldset {
        margin: 0;
        border: 1px solid #d9e2ef;
        border-radius: 8px;
      }

      .state-preview {
        max-height: none;
        border-radius: 8px;
      }

      .learning-card {
        display: grid;
        gap: 12px;
        border: 1px solid #d9e2ef;
        border-radius: 8px;
        padding: 14px;
        background: #f8fafc;
      }

      .learning-card header,
      .learning-card footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .learning-card h3 {
        margin: 0;
      }

      .learning-card small {
        color: #0f766e;
        font-weight: 700;
      }

      .trusted {
        color: #0f766e;
      }

      @media (max-width: 960px) {
        .app-shell,
        .workbench,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
